plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'kotlin-kapt'
    id 'com.google.dagger.hilt.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

// ── Resolução de segredos HMAC ──
// Lê a chave de uma Gradle property (local.properties / gradle.properties / -P) ou de uma
// variável de ambiente. Em builds RELEASE a ausência da chave ABORTA o build (sem fallback).
// Em builds debug, usa um valor de dev explicitamente falso, nunca apto a produção.
def isReleaseBuild = gradle.startParameter.taskNames*.toLowerCase().any { name ->
    name.contains('release') ||
    name == 'build'    || name.endsWith(':build') ||
    name == 'assemble' || name.endsWith(':assemble') ||
    name == 'bundle'   || name.endsWith(':bundle')
}

def localProps = new Properties()
def localPropsFile = rootProject.file('local.properties')
if (localPropsFile.exists()) {
    localPropsFile.withInputStream { localProps.load(it) }
}

def hmacSecret = { String propName ->
    // Precedência: -P / gradle.properties  >  local.properties  >  variável de ambiente.
    def value = project.findProperty(propName) ?: localProps.getProperty(propName) ?: System.getenv(propName)
    if (value == null || value.toString().trim().isEmpty()) {
        if (isReleaseBuild) {
            throw new GradleException(
                "Build release abortado: a chave '${propName}' nao foi encontrada. " +
                "Defina-a em local.properties ou como variavel de ambiente antes de gerar o release.")
        }
        return "DEV_ONLY_FALLBACK_NEVER_RELEASE"
    }
    return value.toString()
}

android {
    namespace 'com.srbr.huginn'
    compileSdk 34

    defaultConfig {
        applicationId "com.srbr.huginn.qr"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        // Segredos injetados em tempo de build — nunca hardcoded em código nem como fallback de release.
        // Defina em local.properties (HUGINN_QR_HMAC_KEY / HUGINN_TOKEN_HMAC_KEY) ou via variável de ambiente.
        buildConfigField "String", "QR_HMAC_KEY",    "\"${hmacSecret('HUGINN_QR_HMAC_KEY')}\""
        buildConfigField "String", "TOKEN_HMAC_KEY", "\"${hmacSecret('HUGINN_TOKEN_HMAC_KEY')}\""
    }

    buildFeatures {
        compose true
        buildConfig true
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
            returnDefaultValues = true
        }
    }
}

dependencies {
    // ── Shared module: domínio + storage de credencial (HuginnCard, QRValidator, CardStorage, etc.) ──
    implementation 'com.srbr.huginn:credential:0.3.0-SNAPSHOT'

    // ── Core ──
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.7.0'

    // ── Compose ──
    def composeBom = platform('androidx.compose:compose-bom:2024.02.00')
    implementation composeBom
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.compose.animation:animation'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.activity:activity-compose:1.8.2'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.7.0'
    implementation 'androidx.navigation:navigation-compose:2.7.6'
    debugImplementation 'androidx.compose.ui:ui-tooling'

    // ── Hilt DI ──
    implementation 'com.google.dagger:hilt-android:2.52'
    kapt 'com.google.dagger:hilt-android-compiler:2.52'
    implementation 'androidx.hilt:hilt-navigation-compose:1.2.0'

    // ── Biometric ──
    implementation 'androidx.biometric:biometric:1.1.0'

    // ── Encrypted Storage ──
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'

    // ── QR Code generation (ZXing core — sem Activity extra) ──
    implementation 'com.google.zxing:core:3.5.3'

    // ── CameraX ──
    implementation 'androidx.camera:camera-core:1.3.1'
    implementation 'androidx.camera:camera-camera2:1.3.1'
    implementation 'androidx.camera:camera-lifecycle:1.3.1'
    implementation 'androidx.camera:camera-view:1.3.1'

    // ── ML Kit Barcode ──
    implementation 'com.google.mlkit:barcode-scanning:17.2.0'

    // ── Coroutines ──
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'

    // ── SplashScreen ──
    implementation 'androidx.core:core-splashscreen:1.0.1'

    // ── Testing ──
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.7.3'
    testImplementation 'io.mockk:mockk:1.13.9'
    testImplementation 'app.cash.turbine:turbine:1.0.0'
    testImplementation 'androidx.test:core:1.5.0'
    testImplementation 'org.robolectric:robolectric:4.11.1'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
    androidTestImplementation composeBom
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'
}

kapt {
    correctErrorTypes true
}
